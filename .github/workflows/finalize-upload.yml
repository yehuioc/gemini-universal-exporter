name: Finalize source upload

on:
  push:
    paths:
      - '.upload_parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble and validate userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_parts/part-*.txt > Gemini_Universal_Exporter.user.js
          sha256sum Gemini_Universal_Exporter.user.js
          node --check Gemini_Universal_Exporter.user.js
      - name: Commit assembled source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemini_Universal_Exporter.user.js
          git commit -m "Add Gemini Universal Exporter v0.4.3 source" || true
          git push origin HEAD:main
