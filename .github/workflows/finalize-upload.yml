name: Finalize source upload

on:
  push:
    paths:
      - '.upload_parts/READY'

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reassemble userscript
        shell: bash
        run: |
          set -euo pipefail
          cat .upload_parts/part-*.txt > Gemini_Universal_Exporter.user.js
          echo "3f72622207475d490c9ed74fe1ee484a400a59ce6adba101e34a64e91be91007  Gemini_Universal_Exporter.user.js" | sha256sum -c -
          node --check Gemini_Universal_Exporter.user.js
      - name: Commit assembled source and clean temporary upload parts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Gemini_Universal_Exporter.user.js
          git rm -r .upload_parts
          git rm .github/workflows/finalize-upload.yml
          git commit -m "Add Gemini Universal Exporter v0.4.3 source"
          git push origin HEAD:main
